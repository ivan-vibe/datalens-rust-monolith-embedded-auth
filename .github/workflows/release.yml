name: release

# Builds the two binaries for every supported platform and attaches them to a GitHub
# Release. Run it on a tag (`git tag v0.1.0 && git push --tags`) or manually:
#
#   gh workflow run release.yml -f tag=v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: system deps (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config
      - name: build monolith
        run: cargo build --release --target ${{ matrix.target }}
      - name: stage
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/datalens-monolith${{ matrix.ext }}" \
             "out/datalens-monolith-embedded-${{ matrix.name }}${{ matrix.ext }}"
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.name }}"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: list
        run: ls -lh assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
