# DataLens Rust monolith — one project, one command:
#
#   docker compose up -d --build      # then open http://localhost:8091 (admin / admin)
#
# Services:
#   postgres  – the official DataLens Postgres image (schema + demo data live only there)
#   auth      – the Rust auth service (login/JWT/users)
#   monolith  – the Rust monolith: US + data-api + ui-api/charts-engine + control-api + meta-manager
#   seed      – one-shot: loads the official demo data shipped inside the Postgres image
#   ui        – the official datalens-ui image, nginx on :8091
#
# No database dumps and no user data are stored in this repository. The demo workbooks come
# from `ghcr.io/datalens-tech/datalens-postgres` (`/init/demo-data`), the same data the
# official DataLens compose installs.
#
# The keys below are the *public demo defaults* from the official DataLens compose, not
# secrets: they exist so the open-source demo runs out of the box. For anything real,
# override AUTH__JWT_KEY / TOKEN_PRIVATE_KEY / *_MASTER_TOKEN / CONTROL_API_CRYPTO_KEY in
# your environment or an override file.
name: datalens-rust-embedded

networks:
  datalens:
    driver: bridge

volumes:
  pg_data:

services:
  postgres:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0
    environment:
      POSTGRES_USER: pg-user
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_MAX_CONNECTIONS: "512"
      POSTGRES_DUMP_SKIP_CONFLICT: "true"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      PGDATA: /var/lib/postgresql/data
      TZ: Etc/UTC
      # The image creates every pg-* database; demo rows are loaded by the `seed` service
      # after the monolith has created the US schema.
      INIT_DB_AUTH: "1"
      INIT_DB_DEMO: "1"
      INIT_DB_META_MANAGER: "1"
      INIT_DB_TEMPORAL: "0"
      INIT_DEMO_DATA: "0"
      INIT_EXTERNAL_POSTGRES: "0"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:25434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg-user -d pg-us-db"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  monolith:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monolith
    environment:
      MONOLITH: "1"
      PUBLIC_PORT: "8099"
      POSTGRES_DSN_LIST: postgres://pg-user:postgres@postgres:5432/pg-us-db
      META_MANAGER_PG_DSN: postgres://pg-user:postgres@postgres:5432/pg-meta-manager-db
      # demo datasets store the host `postgres` in their connection settings
      DL_CONNECTION_HOST_MAP: postgres=postgres:5432
      US_URL: http://127.0.0.1:8099
      META_US_URL: http://127.0.0.1:8099
      UI_PUBLIC_URL: http://127.0.0.1:8099
      CONTROL_API_URL: http://127.0.0.1:8099
      AUTH_ENABLED: "true"
      AUTH__TYPE: NATIVE
      AUTH__JWT_ALGORITHM: PS256
      # Single-binary fork: the auth protocol is served by this process on :8097.
      AUTH_EMBEDDED: "1"
      AUTH_BIND: 0.0.0.0
      AUTH_PORT: "8097"
      AUTH_POSTGRES_DSN: postgres://pg-user:postgres@postgres:5432/pg-auth-db
