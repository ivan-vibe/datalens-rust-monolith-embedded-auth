      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/monolith", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: the official demo data, loaded from the Postgres image itself after the
  # monolith has created the US schema. Nothing here comes from this repository.
  seed:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export PGPASSWORD=postgres
        until psql -h postgres -U pg-user -d pg-us-db -tAc "select 1 from workbooks limit 1" >/dev/null 2>&1; do sleep 2; done
        count=$$(psql -h postgres -U pg-user -d pg-us-db -tAc "select count(*) from workbooks")
        if [ "$$count" != "0" ]; then echo "demo data already present"; exit 0; fi
        POSTGRES_USER_US=pg-user POSTGRES_PASSWORD_US=postgres POSTGRES_DB_US=pg-us-db         POSTGRES_USER_DEMO=pg-user POSTGRES_PASSWORD_DEMO=postgres POSTGRES_DB_DEMO=pg-demo-db         POSTGRES_HOST=postgres POSTGRES_PORT=5432 DEMO_DATA_NAME="DataLens Demo" HC=0 IS_FIX_DLS=false         INIT_DEMO_DATA=1 CONTROL_API_CRYPTO_KEY=ZGF0YWxlbnN1bnNlY3VyZWZlcm5ldGNyeXB0b2tleQo=         /init/seed-demo-data.sh
    environment:
      PGPASSWORD: postgres
    depends_on:
      monolith:
        condition: service_healthy
    restart: "no"

  ui:
    image: ghcr.io/datalens-tech/datalens-ui:0.3831.0
    environment:
      APP_MODE: full
      APP_ENV: production
      APP_INSTALLATION: opensource
      APP_VERSION: 0.3831.0
      RELEASE_VERSION: 2.9.0
      NODE_ENV: production
      APP_PORT: "3030"
      WORKERS: "1"
      TZ: Etc/UTC
      AUTH_ENABLED: "true"
      AUTH_POLICY: required
      AUTH_SIGNUP_DISABLED: "true"
      AUTH_ENDPOINT: http://monolith:8097
      US_ENDPOINT: http://monolith:8099
      BI_DATA_ENDPOINT: http://monolith:8099
      BI_API_ENDPOINT: http://monolith:8099
      META_MANAGER_ENDPOINT: http://monolith:8099
      EXPORT_WORKBOOK_ENABLED: "true"
      UI_CORE_CDN: "false"
      APP_BUILDER_CDN: "false"
      HC: "0"
      HC_MODULES: ""
      HC_ENDPOINT: ""
      HC_PROTOCOL: ""
      YANDEX_MAP_ENABLED: "0"
      YANDEX_MAP_TOKEN: ""
      AUTH_TOKEN_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA+HICDZMfimMIiGdd0dPr
        2N3zxHOJqiVXuvUj/aBBS7c8760rJUh4344sP/0Gid558yH/v1MtzZ0R9w09v6gb
        SNrSiNwIUNGPhbnm9Jf+kMezsI/rkcIdoVm3KJ8CFUYy6MRPzW7iJmIVRHBb82v1
        mAYCCQFU6IRtFIa9hQ8wedWwxqXZekSNS+6NB37dmmQB9kz2E3MY+KRLigOh4i3p
        CZ1ti3HVvMa9Rlgk9FmoWExzub5ECChqwm+vn8yFXjYW7kUSClcV2xx4nbQWqjrR
        yyLk6W2BNOuCFVvz0j+5XkpLAt7tljtVZc+572HBEKpF2mAdmAip5NzeDhKqucJ+
        ZQIDAQAB
        -----END PUBLIC KEY-----
      AUTH_MASTER_TOKEN: auth-master-token
      US_MASTER_TOKEN: us-master-token
    volumes:
      - ./ui-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      monolith:
        condition: service_started
    ports:
      - "8091:8080"
    restart: unless-stopped
